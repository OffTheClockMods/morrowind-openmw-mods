pageName: "Infinite Arrows and Bolts"
pageDesc: "Fired arrows, bolts and thrown weapons come straight back to your quiver, so you never run out. Works with any arrows, including enchanted ones and arrows from other mods. By Off the Clock."
groupMain: "Ammo"
groupMainDesc: "Ammo only comes back while your weapon is drawn and no menu is open, so selling or dropping ammo works as normal."
enabled: "Mod on"
enabledDesc: "Off = ammo is used up as in the normal game."
arrowsBolts: "Arrows and bolts"
arrowsBoltsDesc: "On (default) = the arrow or bolt you fire comes back. Arrows that hit can still end up in the target's inventory as in the normal game, so you may collect extra ones from bodies."
thrown: "Thrown weapons"
thrownDesc: "On (default) = darts, throwing stars and throwing knives come back too. Off = they are used up as normal."
