pageName: "No Weapon and Armor Wear"
pageDesc: "Your weapons, armor and shields stop losing condition, so no more repair trips. Each kind has its own wear percent: 0 = never wears, 100 = the normal game, up to 1000 = ten times faster. By Off the Clock."
groupMain: "Wear"
groupMainDesc: "Percent of the game's normal wear. Decimals are fine."
enabled: "Mod on"
enabledDesc: "Off = everything wears at the normal game speed, whatever the numbers below say."
weaponWear: "Weapon wear (%)"
weaponWearDesc: "0 = your weapons never wear (default). 100 = normal. Higher = faster. Faster wear stops at 1 point; the next normal hit can then break the weapon as usual."
armorWear: "Armor and shield wear (%)"
armorWearDesc: "0 = your armor and shields never wear (default). 100 = normal. Higher = faster. Armor value still depends on condition, so worn armor you already have stays as it is until you repair it."
toolWear: "Lockpick and probe wear (%)"
toolWearDesc: "100 = normal (default): each use costs one use. 0 = lockpicks and probes never run out (a pick on its very last use still breaks)."
npcArmor: "Same armor wear for NPCs and creatures"
npcArmorDesc: "Off (default) = only your gear is changed. On = the armor wear percent above also applies to every other actor's armor (companions and enemies). Their weapons are never changed."
