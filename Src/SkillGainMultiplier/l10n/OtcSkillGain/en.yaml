pageName: "Skill Gain Multiplier"
pageDesc: "Faster or slower skill training from use. x1 = the normal game speed. Only skill use is changed: books, trainers and jail work as normal. Final speed = All skills x the specialization x the single skill. By Off the Clock."
groupMain: "Speed"
groupMainDesc: "Values from 0 to 100. Decimals are fine (0.5 = half speed)."
enabled: "Mod on"
enabledDesc: "Off = every skill trains at the normal speed, whatever the numbers below say."
allSkills: "All skills"
allSkillsDesc: "x1 = normal. x2 = twice as fast. x0 = skills never rise from use (books and trainers still work). Around x20 and up, most uses give a whole skill point, so leveling becomes very fast."
combat: "Combat skills"
combatDesc: "Extra multiplier for the combat skills (Armorer, Athletics, Axe, Block, Blunt Weapon, Heavy Armor, Long Blade, Medium Armor, Spear). x1 = no change."
magic: "Magic skills"
magicDesc: "Extra multiplier for the magic skills (Alchemy, Alteration, Conjuration, Destruction, Enchant, Illusion, Mysticism, Restoration, Unarmored). x1 = no change."
stealth: "Stealth skills"
stealthDesc: "Extra multiplier for the stealth skills (Acrobatics, Hand-to-hand, Light Armor, Marksman, Mercantile, Security, Short Blade, Sneak, Speechcraft). x1 = no change."
groupSkills: "Single skills"
groupSkillsDesc: "One extra multiplier per skill, on top of the values above. x1 = no change. x0 = this skill never rises from use."
skillDesc: "x1 = no change. Higher = faster, lower = slower, 0 = never rises from use."
